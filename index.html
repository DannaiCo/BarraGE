<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ranking Grupo K</title>

<link rel="stylesheet" href="https://use.typekit.net/vsp7vcb.css">

<style>

html, body{
    margin:0;
    padding:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

.contenedor{
    position:relative;
    width:100vw;
    height:100vh;
}

/* VIDEO DE FONDO */

#fondoVideo{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:fill;
    z-index:0;
}

/* CONTENIDO */

#contenido{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:10;
}

/* EQUIPOS */

.equipo{

    position:absolute;

    font-family:"remora-sans-w5", sans-serif;
    font-weight:900;
    font-style:normal;

    font-size:84px;

    color:#012bff;

    text-transform:uppercase;

    white-space:nowrap;
    transform: scaleY(0.50);
    transform-origin:left center;
}

/* PORCENTAJES */

.porcentaje{

    position:absolute;

    font-family:"remora-sans-w5", sans-serif;
    font-weight:900;
    font-style:normal;

    font-size:84px;

    color:#0a2957;

    white-space:nowrap;
    transform: scaleY(0.50);
    transform-origin:left center;
}

/* ========================= */
/* COORDENADAS EQUIPOS */
/* ========================= */

#p1{
    top:53.6%;
    left:36%;
}

#p2{
    top:60.7%;
    left:36%;
}

#p3{
    top:67.5%;
    left:36%;
}

#p4{
    top:73.8%;
    left:36%;
}

/* ========================= */
/* COORDENADAS PORCENTAJES */
/* ========================= */

#v1{
    top:53.6%;
    left:64%;
}

#v2{
    top:60.7%;
    left:64%;
}

#v3{
    top:67.5%;
    left:64%;
}

#v4{
    top:73.8%;
    left:64%;
}

</style>
</head>

<body>

<div class="contenedor">

    <video autoplay muted loop playsinline id="fondoVideo">
        <source src="fondo.mp4" type="video/mp4">
    </video>

    <div id="contenido">

        <div id="p1" class="equipo"></div>
        <div id="p2" class="equipo"></div>
        <div id="p3" class="equipo"></div>
        <div id="p4" class="equipo"></div>

        <div id="v1" class="porcentaje"></div>
        <div id="v2" class="porcentaje"></div>
        <div id="v3" class="porcentaje"></div>
        <div id="v4" class="porcentaje"></div>

    </div>

</div>

<script>

const API_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQaVTvO365cN_YzCVvGteNIh57YdOxFkt9PIhUDMu9aNh7Lge_yug1sI-k7xscq-d6wdHFzfMNKjGFLqxffsDSoDSmrIuelylKqbW4zMjb0oOy9II5Esixi2IHbrr4i-VncxGd2w0imYRQ8s1dkE8cUMA010Xga0S8EF-NUD1a7sElV2PJkJX8VjoJnNXcRK8oFARdXldp9y3_oyBTJMEvE3ql9JXVwIfdn38K9Im8Rfwcg4uXjHrYt0b7dJg9WiQD-40bPAVdOBF7JapIPJZpdKkXcVA&lib=MT1LZbfHctya4uObz9hnmzqeEHa1C_Htb";

async function cargarRanking(){

    try{

        const response = await fetch(API_URL);
        const ranking = await response.json();

        document.getElementById("p1").innerText =
            ranking[0]?.equipo || "";

        document.getElementById("p2").innerText =
            ranking[1]?.equipo || "";

        document.getElementById("p3").innerText =
            ranking[2]?.equipo || "";

        document.getElementById("p4").innerText =
            ranking[3]?.equipo || "";

        document.getElementById("v1").innerText =
            (ranking[0]?.porcentaje ?? 0) + "%";

        document.getElementById("v2").innerText =
            (ranking[1]?.porcentaje ?? 0) + "%";

        document.getElementById("v3").innerText =
            (ranking[2]?.porcentaje ?? 0) + "%";

        document.getElementById("v4").innerText =
            (ranking[3]?.porcentaje ?? 0) + "%";

    }catch(error){

        console.error(error);

    }

}

cargarRanking();
setInterval(cargarRanking,60000);

</script>

</body>
</html>
